global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'ha-postgres-cluster'
    environment: 'development'
scrape_configs:
  - job_name: 'orchestrator'
    static_configs:
      - targets: ['orchestrator:8080']
        labels:
          service: 'orchestrator'
          component: 'control-plane'
  - job_name: 'node-agent-primary'
    static_configs:
      - targets: ['node-agent-primary:8081']
        labels:
          service: 'node-agent'
          node_id: 'pg-primary'
          role: 'primary'
  - job_name: 'node-agent-replica1'
    static_configs:
      - targets: ['node-agent-replica1:8081']
        labels:
          service: 'node-agent'
          node_id: 'pg-replica1'
          role: 'replica'
  - job_name: 'node-agent-replica2'
    static_configs:
      - targets: ['node-agent-replica2:8081']
        labels:
          service: 'node-agent'
          node_id: 'pg-replica2'
          role: 'replica'
  - job_name: 'postgres-primary'
    static_configs:
      - targets: ['postgres-exporter-primary:9187']
        labels:
          service: 'postgres'
          node_id: 'pg-primary'
          role: 'primary'
  - job_name: 'postgres-replica1'
    static_configs:
      - targets: ['postgres-exporter-replica1:9187']
        labels:
          service: 'postgres'
          node_id: 'pg-replica1'
          role: 'replica'
  - job_name: 'postgres-replica2'
    static_configs:
      - targets: ['postgres-exporter-replica2:9187']
        labels:
          service: 'postgres'
          node_id: 'pg-replica2'
          role: 'replica'
  - job_name: 'haproxy'
    static_configs:
      - targets: ['haproxy:7000']
        labels:
          service: 'haproxy'
          component: 'load-balancer'
