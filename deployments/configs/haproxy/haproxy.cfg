global
    log stdout format raw local0
    maxconn 1000

defaults
    log     global
    mode    tcp
    timeout connect 5s
    timeout client  30s
    timeout server  30s
listen stats
    bind *:7000
    mode http
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /
    stats refresh 5s
listen pg_primary
    bind *:5000
    mode tcp
    option httpchk GET /health/primary
    http-check expect status 200
    server pg-primary   pg-primary:5432    check addr node-agent-primary  port 8081 inter 1s fall 1 rise 1
    server pg-replica1  pg-replica1:5432   check addr node-agent-replica1 port 8081 inter 1s fall 1 rise 1 backup
    server pg-replica2  pg-replica2:5432   check addr node-agent-replica2 port 8081 inter 1s fall 1 rise 1 backup
listen pg_replicas
    bind *:5001
    mode tcp
    balance roundrobin
    option httpchk GET /health/replica
    http-check expect status 200

    server pg-replica1  pg-replica1:5432   check addr node-agent-replica1 port 8081 inter 1s fall 1 rise 1
    server pg-replica2  pg-replica2:5432   check addr node-agent-replica2 port 8081 inter 1s fall 1 rise 1
    server pg-primary   pg-primary:5432    check addr node-agent-primary  port 8081 inter 1s fall 1 rise 1 backup
