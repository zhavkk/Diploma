---

- name: Install PostgreSQL 16
  apt:
    name:
      - postgresql-16
      - postgresql-client-16
      - python3-psycopg2
    state: present
    update_cache: true

- name: Check whether PostgreSQL cluster exists
  stat:
    path: /etc/postgresql/16/main/postgresql.conf
  register: pg_cluster_conf

- name: Create PostgreSQL cluster when package already exists without main cluster
  command: pg_createcluster 16 main --start-conf=auto
  when: not pg_cluster_conf.stat.exists

- name: Ensure PostgreSQL data directory exists
  file:
    path: /var/lib/postgresql/16/main
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'

- name: Deploy postgresql.conf
  template:
    src: postgresql.conf.j2
    dest: /etc/postgresql/16/main/postgresql.conf
    owner: postgres
    group: postgres
    mode: '0644'
  notify: restart postgresql

- name: Deploy pg_hba.conf
  template:
    src: pg_hba.conf.j2
    dest: /etc/postgresql/16/main/pg_hba.conf
    owner: postgres
    group: postgres
    mode: '0640'
  notify: reload postgresql

- name: Ensure PostgreSQL is started (primary)
  systemd:
    name: postgresql
    state: started
    enabled: true
  when: pg_role == 'primary'

- name: Apply primary PostgreSQL configuration before replica basebackup
  meta: flush_handlers
  when: pg_role == 'primary'

- name: Set postgres user password (primary only)
  become: true
  become_user: postgres
  postgresql_user:
    name: "{{ pg_user }}"
    password: "{{ pg_password }}"
    state: present
  when: pg_role == 'primary'

- name: Create replication user (primary only)
  become: true
  become_user: postgres
  postgresql_user:
    name: replicator
    password: "{{ replication_password | default('replicator') }}"
    role_attr_flags: REPLICATION
    state: present
  when: pg_role == 'primary'

- name: Stop PostgreSQL before replica initialization
  systemd:
    name: postgresql
    state: stopped
  when: pg_role == 'replica'

- name: Check whether replica is already initialized as standby
  stat:
    path: /var/lib/postgresql/16/main/standby.signal
  register: standby_signal
  when: pg_role == 'replica'

- name: Reset default replica data directory before first basebackup
  file:
    path: /var/lib/postgresql/16/main
    state: absent
  when:
    - pg_role == 'replica'
    - not standby_signal.stat.exists

- name: Recreate replica data directory
  file:
    path: /var/lib/postgresql/16/main
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'
  when: pg_role == 'replica'

- name: Initialize replica from primary (replica only)
  become: true
  become_user: postgres
  shell: |
    if [ ! -f /var/lib/postgresql/16/main/standby.signal ]; then
      PGPASSWORD="{{ replication_password | default('replicator') }}" pg_basebackup \
        -h {{ hostvars['pg-primary']['ansible_host'] }} \
        -D /var/lib/postgresql/16/main \
        -U replicator \
        -Fp -Xs -P -R \
        --checkpoint=fast
    fi
  when: pg_role == 'replica'
  args:
    creates: /var/lib/postgresql/16/main/standby.signal

- name: Ensure PostgreSQL is started (replica)
  systemd:
    name: postgresql
    state: started
    enabled: true
  when: pg_role == 'replica'
